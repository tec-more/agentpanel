# P5 Docker 交付：APP + L3 编排 + L3 网关
#
# 端口约定（容器接管宿主机 9998/9999/9100，客户端地址不变）：
#   宿主机 127.0.0.1:9998  -> L2 容器 9998
#   宿主机 127.0.0.1:9999  -> L3 网关容器 9999
#   宿主机 127.0.0.1:9100  -> L3 编排容器 9100
#
# 回滚到容器旧端口（19998/19999/19100）见 reports/ops/port-switch-9998-9999-9100.md
#
# 依赖前置：
#   1. docker network create --subnet 172.28.0.0/16 agentpanel-net
#   2. docker network connect agentpanel-net agentredis   # 热接入，不重启容器
#   3. 执行 deploy/gateway/scripts/prepare-secrets.ps1 生成本地 secrets 与 .env
#   4. 宿主 8080 入口需要 legacy 项目 `app` 的 app_default 网络（external）；
#      无 legacy 栈的干净机器先 docker network create app_default 再 up，见 runbook §4.1
#
# 迁移不随容器启动执行；需要迁移时单独运行一次性任务（见 P5 runbook）。

name: agentpanel

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile.app
    image: agentpanel-app:${TAG:-local}
    container_name: agentpanel-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:9998:9998"
    environment:
      DEPLOY_ENV: docker
      STRICT_STARTUP: "true"
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: "9998"
      # 迁移不随容器启动执行；需要时用一次性任务单独跑（见 P5 runbook）
      RUN_DB_MIGRATIONS: "false"
      DB_HOST: host.docker.internal
      DB_PORT: "15432"
      DB_NAME: ${DB_NAME:?set DB_NAME in deploy/gateway/.env}
      DB_USER: ${DB_USER:?set DB_USER in deploy/gateway/.env}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_ENABLED: "true"
      REDIS_HOST: agentredis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # 编排容器使用固定 IP，internal_allowed_ips 为精确匹配，不能写 CIDR
      ORCH_INTERNAL_ALLOWED_IPS: "172.28.0.10,127.0.0.1,::1"
      # L2 的 orchestration_proxy 在 proxy 模式下把用户请求转发到该地址
      ORCH_PUBLIC_BASE_URL: "http://orchestration:9100"
      # M2/M3：app 进程不再本地调度/消费——调度由 taskiq-beat、消费由 taskiq-worker
      # 服务接管（本文件下方两服务）；app 只发布（EventRecord + dispatch.kiq）。
      TASKIQ_BROKER_URL_FILE: /run/secrets/taskiq_broker_url
      TASKIQ_VHOST: ${TASKIQ_VHOST:-agentpanel}
    secrets:
      - source: app_config
        target: /app/config.conf
        mode: 0444
      - db_password
      - redis_password
      - taskiq_broker_url
    # agentpanel-net: L3 内部网络（编排固定 IP 172.28.0.10、agentredis、app 服务名解析）
    # app_default: 对外 8080 nginx 所在网络。8080 nginx upstream 已改用容器名
    #   agentpanel-app（Docker DNS 按容器名解析，2026-11-10 起不再需要任何别名）。
    networks:
      agentpanel-net: {}
      app_default: {}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_storage:/app/storage
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    image: agentpanel-gateway:${TAG:-local}
    container_name: agentpanel-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TMPDIR: /tmp
      DB_HOST: host.docker.internal
      DB_PORT: "15432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_ENABLED: "true"
      REDIS_HOST: agentredis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      GW_HOST: 0.0.0.0
      GW_PORT: "9999"
      GW_PUBLIC_BASE_URL: ${GW_PUBLIC_BASE_URL:-http://127.0.0.1:9999}
      GW_FAIL_CLOSED: "true"
      GW_PROVIDER_DOMAIN_ALLOWLIST: ${GW_PROVIDER_DOMAIN_ALLOWLIST:-api.deepseek.com}
    secrets: [db_password, redis_password]
    networks:
      - app_default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  orchestration:
    build:
      context: ../..
      dockerfile: services/orchestration/Dockerfile
    image: agentpanel-orchestration:${TAG:-local}
    container_name: agentpanel-orchestration
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      app:
        condition: service_healthy
    environment:
      TMPDIR: /tmp
      DB_HOST: host.docker.internal
      DB_PORT: "15432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_ENABLED: "true"
      REDIS_HOST: agentredis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ORCH_HOST: 0.0.0.0
      ORCH_PORT: "9100"
      ORCH_ALLOW_REMOTE_BIND: "true"
      ORCH_PUBLIC_BASE_URL: ${ORCH_PUBLIC_BASE_URL:-http://127.0.0.1:9100}
      ORCH_APP_BASE_URL: http://app:9998
      ORCH_INTERNAL_ALLOWED_IPS: "172.28.0.10,127.0.0.1,::1"
    secrets: [db_password, redis_password, orchestration_service_secret]
    command:
      - /bin/sh
      - -c
      - 'export ORCHESTRATION_SERVICE_SECRET="$$(cat /run/secrets/orchestration_service_secret)"; exec python services/orchestration/run.py'
    networks:
      - app_default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # taskiq 独立调度（beat，严格单实例）+ 独立消费（worker，可多副本）
  # M2/M3 后这是唯一调度与消费路径：beat 按 manifest 写调度行入 ap.jobs；
  # worker 消费 ap.jobs + ap.events（作业执行 + 事件分发），可多副本竞争消费。
  # 详见 reports/prd/AgentPanel-taskiq-M1实施拆解-2026-11-14.md §5 与 M2/M3 实施记录。
  # 前置：RabbitMQ 需先建专用 vhost 并授权（D6）。vhost/账号优先级：
  #   config.conf [rabbitmq] taskiq_vhost / taskiq_username / taskiq_password
  #   -> 缺省回退到 virtual_host / username / password
  #   -> vhost 仍缺省为 agentpanel。连接串由 prepare-secrets.ps1 生成。
  # ---------------------------------------------------------------------------
  taskiq-beat:
    image: agentpanel-app:${TAG:-local}
    container_name: agentpanel-beat
    restart: unless-stopped
    command:
      - taskiq-beat-scheduler
      - base.common.taskiq_app.scheduler:scheduler_app
      - --startup
      - base.common.taskiq_app.reconcile:upsert_schedules
    environment:
      DEPLOY_ENV: docker
      RUN_DB_MIGRATIONS: "false"
      DB_HOST: host.docker.internal
      DB_PORT: "15432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_ENABLED: "true"
      REDIS_HOST: agentredis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      TASKIQ_BROKER_URL_FILE: /run/secrets/taskiq_broker_url
      TASKIQ_DB_URL_FILE: /run/secrets/taskiq_db_url
      TASKIQ_VHOST: ${TASKIQ_VHOST:-agentpanel}
    secrets: [db_password, redis_password, taskiq_broker_url, taskiq_db_url]
    networks:
      - app_default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "base/common/taskiq_app/health.py", "beat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  taskiq-worker:
    image: agentpanel-app:${TAG:-local}
    container_name: agentpanel-worker
    restart: unless-stopped
    # 单 worker 消费 ap.jobs + ap.events 两队列（单 broker，task_queues 在 broker.py 声明）
    # 横向扩缩容：docker compose up --scale taskiq-worker=N 或 k8s replicas（见 §5.2）
    command:
      - taskiq
      - worker
      - base.common.taskiq_app.broker:broker
      - base.common.taskiq_app.jobs
      - base.common.taskiq_app.events
      - --workers
      - "2"
      - --ack-type
      - when_executed
      - --max-prefetch
      - "0"
    environment:
      DEPLOY_ENV: docker
      RUN_DB_MIGRATIONS: "false"
      DB_HOST: host.docker.internal
      DB_PORT: "15432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_ENABLED: "true"
      REDIS_HOST: agentredis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      TASKIQ_BROKER_URL_FILE: /run/secrets/taskiq_broker_url
      TASKIQ_VHOST: ${TASKIQ_VHOST:-agentpanel}
    secrets: [db_password, redis_password, taskiq_broker_url]
    networks:
      - app_default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "base/common/taskiq_app/health.py", "worker"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  app_default:
    external: true

secrets:
  db_password:
    file: ./secrets/db_password
  redis_password:
    file: ./secrets/redis_password
  orchestration_service_secret:
    file: ./secrets/orchestration_service_secret
  app_config:
    file: ./secrets/app_config.conf
  taskiq_broker_url:
    file: ./secrets/taskiq_broker_url
  taskiq_db_url:
    file: ./secrets/taskiq_db_url

volumes:
  app_storage:
