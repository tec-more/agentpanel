# agentpanel 站点配置

upstream agentpanel_app {
    server app:9998;
    # 单 worker 后端：keepalive 连接复用即可，无需负载均衡策略
    keepalive 32;
}

# WebSocket 升级头：dsh 浏览器的实时通道是 /api/remote.mux（WebSocket）。
# 命中 upgrade 时转发 Upgrade/Connection: upgrade；普通请求保持空 Connection（不打断 SSE/keepalive）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

map $upstream_http_cache_control $spa_cache_control {
    default '';
    ''      'no-store, must-revalidate';
}

server {
    listen 80;
    server_name _;

    # 带内容 hash 的构建产物：文件名即版本号，可安全长缓存。
    # 不写 always，避免把 404（旧 bundle 已从 dist 删除）也缓存一年。
    location ^~ /assets/ {
        proxy_pass http://agentpanel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://agentpanel_app;
        proxy_http_version 1.1;

        # 通用头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级：命中 upgrade 时透传 Upgrade/Connection: upgrade，
        # 否则后端只会收到普通 HTTP GET，/api/v1/*/ws 返回 404（握手失败）。
        # 普通请求（含 SSE）$connection_upgrade 为空，等价于清空 Connection 保持 keepalive，
        # 不打断 H-3 的 SSE 长连接约束。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # H-3 核心：SSE 流式响应必须关缓冲，否则事件帧被攒批、心跳帧延迟导致误判断开
        proxy_buffering off;
        proxy_cache off;

        # 见文件顶部 map 说明：仅给上游未设置 Cache-Control 的响应（SPA 入口
        # HTML、普通 API）补默认禁缓存头，杜绝发版后浏览器继续用旧 index.html。
        # 上游自带 Cache-Control 的 SSE / 快照响应不被覆盖。
        add_header Cache-Control $spa_cache_control always;

        # H-3 核心：读超时覆盖 HITL 长暂停（心跳帧 15s 保活；1h 覆盖常规暂停，
        # 72h 极限场景由心跳帧持续刷新超时窗口，无需无限放大）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # 分块传输直通（SSE 走 chunked）
        chunked_transfer_encoding on;
    }

    # Prometheus 指标端点（如需对外暴露可单独加访问控制；默认随站点转发）
    location = /metrics {
        proxy_pass http://agentpanel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 内网抓取场景建议加 allow/deny 收敛：
        # allow 10.0.0.0/8; deny all;
    }
}