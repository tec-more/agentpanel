# agentpanel 站点配置
# H-3 硬约束：SSE 长连接必须 ①关闭代理缓冲 ②空闲超时 ≥30s（SSE 心跳帧 15s，留一倍余量）
# 验收实测：SSE 心跳帧 16s 可达；断开自愈 P95 0.08s
#
# 2026-11-09 F1 说明：本文件属于 legacy 单体栈（upstream 指向 app:9998），不是 P7
# 三容器部署的运行态配置。P7 的正式入口是 127.0.0.1:9998 / 9999 / 9100；对外 8080
# 由另一目录 D:\programs\fastapi\aipaneladmin\deploy\nginx\conf.d\aipanel.conf 挂载，
# 该运行态 upstream 已切到 agentpanel-l2:9998（新 L2 容器在 app_default 网络上的别名）。
# 若要把本文件也指向三容器 L2，需同时把 upstream 改为 agentpanel-l2:9998 并让 nginx
# 接入该别名所在网络；不要只改 upstream 值而不接网络，否则 8080 会 502。
# 重建 L2 容器后的别名恢复命令见 reports/ops/l3-split-p7-runbook.md §4。

upstream agentpanel_app {
    server app:9998;
    # 单 worker 后端：keepalive 连接复用即可，无需负载均衡策略
    keepalive 32;
}

# WebSocket 升级头：dsh 浏览器的实时通道是 /api/remote.mux（WebSocket）。
# 命中 upgrade 时转发 Upgrade/Connection: upgrade；普通请求保持空 Connection（不打断 SSE/keepalive）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://agentpanel_app;
        proxy_http_version 1.1;

        # 通用头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：清空 Connection 头启用 keepalive，且不做 upgrade 干扰
        proxy_set_header Connection "";

        # H-3 核心：SSE 流式响应必须关缓冲，否则事件帧被攒批、心跳帧延迟导致误判断开
        proxy_buffering off;
        proxy_cache off;

        # H-3 核心：读超时覆盖 HITL 长暂停（心跳帧 15s 保活；1h 覆盖常规暂停，
        # 72h 极限场景由心跳帧持续刷新超时窗口，无需无限放大）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # 分块传输直通（SSE 走 chunked）
        chunked_transfer_encoding on;
    }

    # Prometheus 指标端点（如需对外暴露可单独加访问控制；默认随站点转发）
    location = /metrics {
        proxy_pass http://agentpanel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 内网抓取场景建议加 allow/deny 收敛：
        # allow 10.0.0.0/8; deny all;
    }
}