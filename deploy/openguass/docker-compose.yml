
services:
  opengauss:
    image: opengauss/opengauss-server:latest
    container_name: opengauss
    restart: always
    # 端口映射，宿主机5432映射容器5432
    ports:
      - "15432:5432"
    # 持久化数据卷，删除容器数据不丢失
    volumes:
      - F:/opengauss_data:/var/lib/opengauss
    environment:
      # 数据库超级用户密码（必须设置，不能空）
      GS_PASSWORD: Admin@123456
      # 数据库编码
      LANG: en_US.UTF-8
    # 权限配置
    privileged: true
    # 接入 app 栈所在的网络，使 agentpanel-app 能用服务名 `opengauss` 直连（端口用容器内 5432）
    networks:
      - app_default

# 复用 deploy/app 栈创建的网络，避免容器间跨网络隔离导致 app 解析不到 opengauss
networks:
  app_default:
    external: true