
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - F:/qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: 8sK7xR2pG9tL5bN3qA6dF4zJ
    networks:
      - app_default
networks:
  app_default:
    external: true