# RabbitMQ 静态配置（挂载为 /etc/rabbitmq/rabbitmq.conf）
#
# 关键：rabbitmq 官方镜像【不会】自动加载 /etc/rabbitmq/definitions.json，
# 必须在此显式声明 load_definitions，节点启动时才导入 definitions.json 中
# 声明的专用 vhost / 账号 / 权限（导入为合并式，不影响镜像环境变量创建的
# admin 用户与 / vhost）。
# 详见 deploy/rabbitmq/definitions.json 与 reports/prd/AgentPanel-taskiq-M1实施拆解-2026-11-14.md D6。
load_definitions = /etc/rabbitmq/definitions.json
