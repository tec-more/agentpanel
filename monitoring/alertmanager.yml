# T7.4 后续：L3 拆分观察期告警通知链路。
# 告警由 prometheus.yml 的 alerting.alertmanagers 送入本实例，规则见 alert_rules.yml。
#
# 通知渠道：默认 webhook 指向常驻服务 alert-webhook-logger（monitoring 网络内），
# 告警自动落盘到 monitoring/alert-sink/alert-events.jsonl，不再是占位 URL。
# 运维接入正式外部渠道时，修改下方 url 后 POST http://127.0.0.1:9093/-/reload 即可。
# 注意：本镜像为 alertmanager 0.34.2，不支持 --config.expand-env，配置文件中不可写 ${VAR}。
# 告警同时仍在 Alertmanager 内持久化、可在 9093 UI/API 查询；本地落盘只是留痕通道，
# 不等同于短信/邮件等外部值班通知——后者仍是收口前需补齐或书面接受的边界。

global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: default-webhook
    webhook_configs:
      - url: 'http://alert-webhook-logger:9094/alerts'
        send_resolved: true
        max_alerts: 20

# 同一 alertname + job 已有 critical 时抑制对应的 warning，避免重复打扰。
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname', 'job']
