global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    # T7.4 后续：告警规则求值后送入 Alertmanager（monitoring-deployment.yml 的
    # alertmanager 服务）。此前该列表为空，规则只求值、不外发。
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aipaneladmin'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9998']

  # T7.4：L3 物理拆分后的两个独立进程；端口由 deploy/l3 compose 映射到宿主回环。
  - job_name: 'l3-gateway'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9999']
        labels:
          service: l3-gateway

  - job_name: 'l3-orchestration'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: l3-orchestration

  - job_name: 'pushgateway'
    scrape_interval: 10s
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'node_exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node_exporter:9100']